<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>katie's demo page</title>
    <style>
        body {
            background: #c69090;
            color: bisque;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        }

        h1 {
            font-family: 'Times New Roman', Times, serif;
        }

        p {
            color: #926f89;
        }

        .zoey {
            color: rgb(236, 173, 173);
        }

        #tom {
            color: rgb(238, 214, 214);
        }

        ul {
            margin: 0%;
            padding: 0%;
            list-style: none;
        }

        ul li a {
            color: rgb(137, 203, 165);
            text-decoration: none;
            text-align: center;
            background: rgb(202, 228, 176);
            display: flex;
            justify-content: center;
            align-items: center;
            width: 200px;
            height: 30px;
            margin: 10px;
            border: 2px solid rgb(17, 16, 16);
            border-radius: 10px;
            box-shadow: -5px 5px 10px rgba(0, 0, 0, 0.3);
            scale: 1;
            transition: scale .6s, box-shadow .6s, background .6s, color .6s;
        }

        ul li a:hover {
            background: rgb(93, 106, 96);  
            color: black;
            box-shadow: 5px 15px 10px rgb(128, 196, 156);
            scale: 1.2;

        }

    </style>
</head>

<body>
    <h1>hello. i'm katie popp.</h1>
    <p class="zoey"><span id="tom">welcome</span>to my page</p>
