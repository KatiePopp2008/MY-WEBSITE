<!doctype html>

<html lang="en">
<head>
    <meta charset="utf-8">
    <title>katie popp's demo page</title>
    <style>
    div {
        width: 300px;
        height: 300px;
        background: bisque;
        margin: 50px;
    }
    #static {
        background: paleturquoise;
        position:static;/*default*/
    }
    #sticky {
        background: palevioletred;
        position: sticky;
    }
    #relative {
        background: palegoldenrod;
        position: relative;
        left: 100px;
        top: -100px;
        z-index: -5;
    }
    #fixed {
        background: orange;
        position: fixed;
        left: 200px;
        top:0;
    }
    #absolute {
        background: palegreen;
        position: absolute;
        left: 300px;
        bottom: -300px; 
    }
</style>
</head>

<body>
    <div id="static"></div>

    <div id="relative"></div>

    <div id="fixed"></div>

    <div id="absolute"></div>

    <div id="sticky"></div>
  
</body>

</html>
